<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-ag" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heein Fragrâncias - Essências dos melhores perfumes do mundo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-gold': '#CDAA00',
              'brand-dark': '#0a0a0a',
            },
            fontFamily: {
              'sans': ['Montserrat', 'sans-serif'],
            },
            boxShadow: {
              'gold-glow': '0 0 15px rgba(205, 170, 0, 0.6)',
              'gold-glow-lg': '0 0 25px rgba(205, 170, 0, 0.7)',
            },
            keyframes: {
              fadeIn: {
                'from': { opacity: '0' },
                'to': { opacity: '1' },
              },
              fadeInRight: {
                'from': { opacity: '0', transform: 'translateX(20px)' },
                'to': { opacity: '1', transform: 'translateX(0)' },
              },
            },
            animation: {
              'fade-in': 'fadeIn 0.4s ease-in-out',
              'fade-in-right': 'fadeInRight 0.5s ease-out forwards',
            },
          }
        }
      }
    </script>
    <style>
      body {
        background-image: url('https://i.imgur.com/SxlhJlF.jpeg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .hide-scrollbar::-webkit-scrollbar {
          display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      .hide-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      
      /* Styles for auto-scroll carousel */
      @keyframes scroll-x {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); } /* Scroll halfway for seamless loop with duplicated items */
      }

      .animate-scroll-x {
        /* Adjust duration based on the number of items. ~5s per item for 8 items */
        animation: scroll-x 40s linear infinite;
      }
      
      .group:hover .pause-animation {
        animation-play-state: paused;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0"
  }
}
</script>
</head>
  <body class="bg-brand-dark text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
